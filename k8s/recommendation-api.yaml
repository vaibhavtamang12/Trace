apiVersion: v1
kind: ConfigMap
metadata:
  name: recommendation-config
data:
  APP_ENV: production
  MODEL_PATH: /app/data/processed/model.joblib
  FEATURE_VERSION: v1
---
apiVersion: v1
kind: Secret
metadata:
  name: recommendation-secrets
type: Opaque
stringData:
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: recommendation-api}
  template:
    metadata:
      labels: {app: recommendation-api}
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/recommendation-platform:latest
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: recommendation-config}
            - secretRef: {name: recommendation-secrets}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-api
spec:
  selector: {app: recommendation-api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recommendation-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recommendation-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
