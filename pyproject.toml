[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-recommendation-platform"
version = "0.1.0"
description = "Production-oriented real-time recommendation and personalization MLOps platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Trace Contributors"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<2.0",
  "scikit-learn>=1.5,<2.0",
  "pyyaml>=6.0,<7.0",
  "prometheus-client>=0.20,<1.0",
  "redis>=5.0,<6.0",
  "kafka-python>=2.0,<3.0",
  "pyarrow>=17.0,<19.0",
  "mlflow>=2.15,<3.0",
  "feast>=0.40,<1.0",
  "onnxruntime>=1.18,<2.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "pre-commit>=3.8,<4.0",
]

[project.scripts]
recommendation-api = "recommendation_platform.api.main:run"
generate-data = "recommendation_platform.ingestion.generator:main"
train-model = "recommendation_platform.training.train:main"
run-stream = "recommendation_platform.streaming.processor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --cov=src/recommendation_platform --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["numpy.*", "pandas.*", "feast.*", "mlflow.*", "kafka.*"]
follow_imports = "skip"
ignore_errors = true

[tool.coverage.run]
omit = ["*/__init__.py"]
