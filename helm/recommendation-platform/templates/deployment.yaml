apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "recommendation-platform.fullname" . }}
  labels: {{- include "recommendation-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "recommendation-platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "recommendation-platform.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8000}]
          env:
            {{- range $key, $value := .Values.config }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
